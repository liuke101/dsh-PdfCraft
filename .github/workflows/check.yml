name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the committed host output
        run: npm run build
      - name: Fail when the committed build output is stale
        run: test -z "$(git status --porcelain -- dist)"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
